class BankAccount {
    int accountNumber;
    String holderName;
    double balance;

    // Parameterized Constructor
    BankAccount(int accountNumber, String holderName, double balance) {
        this.accountNumber = accountNumber;
        this.holderName = holderName;
        this.balance = balance;
    }

    void deposit(double amt) {
        balance += amt;
        System.out.println("Deposited ₹" + amt + " | New Balance: ₹" + balance);
    }

    void deposit(double amt, String remark) {
        balance += amt;
        System.out.println("Deposited ₹" + amt + " [" + remark + "] | New Balance: ₹" + balance);
    }

    void withdraw(double amt) {
        if (amt > balance) {
            System.out.println("Insufficient balance!");
        } else {
            balance -= amt;
            System.out.println("Withdrawn ₹" + amt + " | New Balance: ₹" + balance);
        }
    }

    void displayBalance() {
        System.out.println("Account: " + accountNumber + " | Holder: " + holderName + " | Balance: ₹" + balance);
    }

    String checkMinBalance() {
        if (balance < 1000) {
            return "WARNING: Balance below minimum limit of ₹1000!";
        }
        return "Balance is above minimum limit.";
    }
}

public class BankSystem {
    public static void main(String[] args) {
        BankAccount acc1 = new BankAccount(1001, "Amit", 5000);
        BankAccount acc2 = new BankAccount(1002, "Priya", 800);
        BankAccount acc3 = new BankAccount(1003, "Ravi", 2000);

        System.out.println("=== Account 1 ===");
        acc1.displayBalance();
        acc1.deposit(2000);
        acc1.displayBalance();
        System.out.println(acc1.checkMinBalance());

        System.out.println("\\n=== Account 2 ===");
        acc2.displayBalance();
        acc2.withdraw(700);
        acc2.displayBalance();
        System.out.println(acc2.checkMinBalance());

        System.out.println("\\n=== Account 3 (Overloaded deposit) ===");
        acc3.deposit(500, "Salary Credit");
        acc3.displayBalance();
        System.out.println(acc3.checkMinBalance());
    }
}`

class Employee {
    int empId;
    String name;
    double basicSalary;
    String department;

    // Default Constructor
    Employee() {
        this(0, "Unknown", 0.0, "General");
    }

    // Parameterized Constructor using 'this'
    Employee(int empId, String name, double basicSalary, String department) {
        this.empId = empId;
        this.name = name;
        this.basicSalary = basicSalary;
        this.department = department;
    }

    double calculateHRA() { return 0.20 * basicSalary; }
    double calculateDA()  { return 0.11 * basicSalary; }
    double calculateNetSalary() { return basicSalary + calculateHRA() + calculateDA(); }

    void displayPayslip() {
        System.out.println("--- Payslip for " + name + " ---");
        System.out.println("ID: " + empId + " | Dept: " + department);
        System.out.printf("Basic: ₹%.2f | HRA: ₹%.2f | DA: ₹%.2f%n",
                basicSalary, calculateHRA(), calculateDA());
        System.out.printf("Net Salary: ₹%.2f%n", calculateNetSalary());
    }

    void displayPayslip(boolean showDeductions) {
        displayPayslip();
        if (showDeductions) {
            double tax = 0.10 * calculateNetSalary();
            System.out.printf("Tax Deduction (10%%): ₹%.2f%n", tax);
            System.out.printf("In-hand Salary: ₹%.2f%n", calculateNetSalary() - tax);
        }
    }
}

public class PayrollSystem {
    public static void main(String[] args) {
        Employee e1 = new Employee(201, "Rohit", 40000, "IT");
        Employee e2 = new Employee(202, "Sneha", 60000, "HR");
        Employee e3 = new Employee(203, "Karan", 30000, "Finance");

        Employee[] employees = {e1, e2, e3};
        for (Employee e : employees) {
            if (e.calculateNetSalary() > 50000) {
                e.displayPayslip(true);
            } else {
                e.displayPayslip();
            }
            System.out.println();
        }
    }
}`

class Transaction {
    void processPayment(int amount) {

        System.out.println("Processing payment: ₹" + amount);

// Runtime Polymorphism — Method Overriding
class Account {
    double principal;
    Account(double principal) { this.principal = principal; }
    double calculateInterest() { return 0; }
    String getType() { return "Account"; }
}

class SavingsAccount extends Account {
    SavingsAccount(double principal) { super(principal); }
    @Override
    double calculateInterest() { return principal * 0.04; }
    @Override
    String getType() { return "Savings Account"; }
}

class FixedDeposit extends Account {
    FixedDeposit(double principal) { super(principal); }
    @Override
    double calculateInterest() { return principal * 0.07; }
    @Override
    String getType() { return "Fixed Deposit"; }
}

public class BankPolymorphism {
    public static void main(String[] args) {
        System.out.println("=== Method Overloading ===");
        Transaction t = new Transaction();
        t.processPayment(5000);
        t.processPayment(2500.50);
        t.processPayment(1000.0, "EMI Payment");
        t.processPayment("upi@bank", 3000);

        System.out.println("\\n=== Method Overriding (Dynamic Dispatch) ===");
        Account[] accounts = {new SavingsAccount(50000), new FixedDeposit(100000)};
        for (Account acc : accounts) {
            System.out.printf("%s Interest: ₹%.0f%n", acc.getType(), acc.calculateInterest());
        }
    }
}`

// Custom Checked Exception
class InsufficientFundsException extends Exception {
    InsufficientFundsException(String message) { super(message); }
}

// Custom Checked Exception
class DailyLimitExceededException extends Exception {
    DailyLimitExceededException(String message) { super(message); }
}

// Custom Unchecked Exception
class InvalidAmountException extends RuntimeException {
    InvalidAmountException(String message) { super(message); }
}

class ATM {
    double balance;
    double dailyWithdrawn = 0;
    final double DAILY_LIMIT = 20000;

    ATM(double balance) { this.balance = balance; }

    void withdraw(double amount) throws InsufficientFundsException, DailyLimitExceededException {
        try {
            // Unchecked validation
            if (amount <= 0 || amount % 100 != 0) {
                throw new InvalidAmountException("Invalid amount: ₹" + amount + ". Must be positive multiple of 100.");
            }
            if (dailyWithdrawn + amount > DAILY_LIMIT) {
                throw new DailyLimitExceededException("Daily limit of ₹" + DAILY_LIMIT + " exceeded!");
            }
            if (amount > balance) {
                throw new InsufficientFundsException("Insufficient balance! Available: ₹" + balance);
            }
            balance -= amount;
            dailyWithdrawn += amount;
            System.out.println("✓ Withdrawal of ₹" + amount + " successful. Remaining Balance: ₹" + balance);
        } catch (InvalidAmountException e) {
            System.out.println("✗ Invalid Amount: " + e.getMessage());
        } finally {
            System.out.println("  Transaction log saved.");
        }
    }
}

public class ATMSystem {
    public static void main(String[] args) {
        ATM atm = new ATM(15000);

        // 1. Valid withdrawal
        try { atm.withdraw(5000); }
        catch (InsufficientFundsException | DailyLimitExceededException e) {
            System.out.println("✗ " + e.getMessage());
        }

        // 2. Daily limit breach
        try { atm.withdraw(12000); }
        catch (DailyLimitExceededException e) {
            System.out.println("✗ Daily Limit: " + e.getMessage());
            System.out.println("  Transaction log saved.");
        } catch (InsufficientFundsException e) {
            System.out.println("✗ " + e.getMessage());
        }

        // 3. Invalid amount
        try { atm.withdraw(-500); }
        catch (InsufficientFundsException | DailyLimitExceededException e) {
            System.out.println("✗ " + e.getMessage());
        }

        // 4. Insufficient funds
        try { atm.withdraw(8000); }
        catch (InsufficientFundsException e) {
            System.out.println("✗ Insufficient Funds: " + e.getMessage());
            System.out.println("  Transaction log saved.");
        } catch (DailyLimitExceededException e) {
            System.out.println("✗ " + e.getMessage());
        }
    }

            s.submitted = true;

            System.out.println("✗ Format Error: " + e.getMessage());
        } finally {

        }
    }

import java.util.Random;

class StockUpdater implements Runnable {
    String stockName;
    volatile double price;

    StockUpdater(String stockName, double initialPrice) {
        this.stockName = stockName;
        this.price = initialPrice;
    }

    @Override
    public void run() {
        Random rand = new Random();
        for (int i = 1; i <= 5; i++) {
            double change = price * 0.05 * (rand.nextBoolean() ? 1 : -1);
            price += change;
            System.out.printf("[%s] Update %d: ₹%.2f%n", stockName, i, price);
            try { Thread.sleep(500); } catch (InterruptedException e) { break; }
        }
    }
}

class StockMonitor extends Thread {
    StockUpdater target;
    double threshold;

    StockMonitor(StockUpdater target, double threshold) {
        this.target = target;
        this.threshold = threshold;
    }

    @Override
    public void run() {
        for (int i = 0; i < 5; i++) {
            if (target.price > threshold) {
                System.out.println("ALERT: " + target.stockName + " crossed ₹" + threshold + "! Current: ₹" + String.format("%.2f", target.price));
            }
            try { Thread.sleep(500); } catch (InterruptedException e) { break; }
        }
    }
}

public class StockMarket {
    public static void main(String[] args) throws InterruptedException {
        StockUpdater reliance = new StockUpdater("RELIANCE", 2500);
        StockUpdater infy     = new StockUpdater("INFY", 1800);
        StockUpdater tcs      = new StockUpdater("TCS", 4000);

        Thread t1 = new Thread(reliance, "RELIANCE-Thread");
        Thread t2 = new Thread(infy, "INFY-Thread");
        Thread t3 = new Thread(tcs, "TCS-Thread");
        StockMonitor monitor = new StockMonitor(reliance, 2600);

        System.out.println("Thread States before start: " + t1.getState());
        t1.start(); t2.start(); t3.start(); monitor.start();
        System.out.println("Thread States after start: " + t1.getState());

        t1.join(); t2.join(); t3.join(); monitor.join();

        System.out.println("\\n=== Final Prices ===");
        System.out.printf("RELIANCE: ₹%.2f | INFY: ₹%.2f | TCS: ₹%.2f%n",
                reliance.price, infy.price, tcs.price);
        System.out.println("Thread State after finish: " + t1.getState());
    }
}`

import java.util.*;

class ProductItem {
    String productId, name, category;
    double price;

    ProductItem(String productId, String name, double price, String category) {
        this.productId = productId;
        this.name = name;
        this.price = price;
        this.category = category;
    }

    @Override
    public String toString() {
        return productId + " | " + name + " | ₹" + price + " | " + category;
    }
}

class ShoppingCart {
    ArrayList<ProductItem> catalogue = new ArrayList<>();
    HashMap<String, Integer> cart = new HashMap<>();
    Stack<String> undoHistory = new Stack<>();
    TreeMap<Double, String> priceMap = new TreeMap<>();

    void addToCatalogue(ProductItem p) {
        catalogue.add(p);
        priceMap.put(p.price, p.name);
    }

    void addToCart(String productId, int qty) {
        cart.put(productId, cart.getOrDefault(productId, 0) + qty);
        undoHistory.push(productId);
        System.out.println("Added to cart: " + productId + " x" + qty);
    }

    void undoLastAdd() {
        if (!undoHistory.isEmpty()) {
            String last = undoHistory.pop();
            cart.remove(last);
            System.out.println("Undo: Removed " + last + " from cart.");
        }
    }

    void displayCartTotal() {
        System.out.println("\\n=== Cart Total ===");
        double total = 0;
        for (Map.Entry<String, Integer> entry : cart.entrySet()) {
            for (ProductItem p : catalogue) {
                if (p.productId.equals(entry.getKey())) {
                    double cost = p.price * entry.getValue();
                    System.out.printf("%s x%d = ₹%.0f%n", p.name, entry.getValue(), cost);
                    total += cost;
                }
            }
        }
        System.out.printf("TOTAL: ₹%.0f%n", total);
    }

    void displaySortedByPrice() {
        System.out.println("\\n=== Products Sorted by Price ===");
        priceMap.forEach((price, name) -> System.out.printf("%-20s ₹%.0f%n", name, price));
    }

    void searchProduct(String id) {
        boolean found = catalogue.stream().anyMatch(p -> p.productId.equals(id));
        System.out.println("Product [" + id + "]: " + (found ? "Found" : "Not found"));
    }
}

        topPanel.add(btnClear); topPanel.add(lblCount);

        model = new DefaultTableModel(bookData, cols) {
            public boolean isCellEditable(int r, int c) { return false; }
        };

        table.setSelectionMode(ListSelectionModel.SINGLE_SELECTION);

        add(topPanel, BorderLayout.NORTH);
        add(new JScrollPane(table), BorderLayout.CENTER);

        btnSearch.addActionListener(e -> filterTable());
        cbCategory.addActionListener(e -> filterTable());

        btnIssue.addActionListener(e -> {
            int row = table.getSelectedRow();
            if (row < 0) { JOptionPane.showMessageDialog(this, "Select a book first!"); return; }
            if (model.getValueAt(row, 4).equals("Issued")) {
                JOptionPane.showMessageDialog(this, "Book already issued!"); return;

        }
        lblCount.setText("Showing: " + count + " books");
    }

        SwingUtilities.invokeLater(LibraryGUI::new);

import java.sql.*;
import java.time.LocalDate;

public class LibraryJDBC {
    static final String URL  = "jdbc:mysql://localhost:3306/library_db";
    static final String USER = "root";
    static final String PASS = "password"; // change as needed

    public static void main(String[] args) {
        try (Connection conn = DriverManager.getConnection(URL, USER, PASS)) {
            System.out.println("Connected to library_db");

            // (a) Create tables
            Statement stmt = conn.createStatement();
            stmt.execute("DROP TABLE IF EXISTS IssuedBooks");
            stmt.execute("DROP TABLE IF EXISTS Books");
            stmt.execute("CREATE TABLE Books (BookId VARCHAR(10) PRIMARY KEY, Title VARCHAR(100), " +
                "Author VARCHAR(100), Category VARCHAR(50), Available INT)");
            stmt.execute("CREATE TABLE IssuedBooks (IssueId INT AUTO_INCREMENT PRIMARY KEY, " +
                "BookId VARCHAR(10), StudentName VARCHAR(100), IssueDate DATE, ReturnDate DATE, " +
                "FOREIGN KEY (BookId) REFERENCES Books(BookId))");

            // (b) Insert 5 books
            String insertBook = "INSERT INTO Books VALUES (?,?,?,?,?)";
            PreparedStatement ps = conn.prepareStatement(insertBook);
            String[][] books = {
                {"B001","Core Java","Schildt","Technology","1"},
                {"B002","DBMS","Korth","Technology","1"},
                {"B003","Fiction","Chetan Bhagat","Fiction","1"},
                {"B004","OS Concepts","Silberschatz","Technology","1"},
                {"B005","History of India","Romila Thapar","History","1"}
            };
            for (String[] b : books) {
                ps.setString(1,b[0]); ps.setString(2,b[1]); ps.setString(3,b[2]);
                ps.setString(4,b[3]); ps.setInt(5,Integer.parseInt(b[4])); ps.executeUpdate();
            }
            System.out.println("5 books inserted.");

            // (c) Display all books
            System.out.println("\\n=== All Books ===");
            ResultSet rs = stmt.executeQuery("SELECT * FROM Books");
            while (rs.next())
                System.out.printf("%-6s %-20s %-15s %-12s %s%n",
                    rs.getString(1),rs.getString(2),rs.getString(3),rs.getString(4),
                    rs.getInt(5)==1?"Available":"Issued");

            // (d) Issue a book — transaction
            conn.setAutoCommit(false);
            try {
                PreparedStatement issuePS = conn.prepareStatement(
                    "INSERT INTO IssuedBooks (BookId, StudentName, IssueDate) VALUES (?,?,?)");
                issuePS.setString(1,"B001"); issuePS.setString(2,"Asha");
                issuePS.setDate(3, Date.valueOf(LocalDate.now())); issuePS.executeUpdate();
                stmt.executeUpdate("UPDATE Books SET Available=0 WHERE BookId='B001'");
                conn.commit();
                System.out.println("\\nBook B001 issued to Asha — transaction committed.");
            } catch (Exception e) { conn.rollback(); System.out.println("Issue failed, rolled back."); }

            // (e) Return a book — transaction
            conn.setAutoCommit(false);
            try {
                PreparedStatement retPS = conn.prepareStatement(
                    "UPDATE IssuedBooks SET ReturnDate=? WHERE IssueId=1");
                retPS.setDate(1, Date.valueOf(LocalDate.now())); retPS.executeUpdate();
                stmt.executeUpdate("UPDATE Books SET Available=1 WHERE BookId='B001'");
                conn.commit();
                System.out.println("Book returned — transaction committed.");
            } catch (Exception e) { conn.rollback(); System.out.println("Return failed, rolled back."); }
            conn.setAutoCommit(true);

            // (f) Delete a book
            stmt.executeUpdate("DELETE FROM Books WHERE BookId='B003'");
            System.out.println("B003 deleted.");

            // (g) Display Technology books
            System.out.println("\\n=== Technology Books ===");
            PreparedStatement catPS = conn.prepareStatement("SELECT * FROM Books WHERE Category=?");
            catPS.setString(1,"Technology");
            ResultSet rs2 = catPS.executeQuery();
            while (rs2.next())
                System.out.println(rs2.getString(1)+" | "+rs2.getString(2)+" | "+rs2.getString(3));

        } catch (SQLException e) { e.printStackTrace(); }
    }
}`

import java.util.*;

public class GenericInventory {
    // (a) Generic method checkIdentical
    static <T> boolean checkIdentical(T[] arr1, T[] arr2) {
        if (arr1.length != arr2.length) return false;
        for (int i = 0; i < arr1.length; i++) {
            if (!arr1[i].equals(arr2[i])) return false;
        }
        return true;
    }

    // (b) Generic method sumByParity
    static String sumByParity(List<? extends Number> numbers) {
        long evenSum = 0, oddSum = 0;
        for (Number n : numbers) {
            int val = n.intValue();
            if (val % 2 == 0) evenSum += val;
            else oddSum += val;
        }
        return "Even Sum: " + evenSum + ", Odd Sum: " + oddSum;
    }

    // (c) Generic class Inventory<T>
    static class Inventory<T> {
        private List<T> items = new ArrayList<>();

        void add(T item) {
            items.add(item);
            System.out.println("Added: " + item);
        }

        void remove(T item) {
            if (items.remove(item))
                System.out.println("Removed: " + item);
            else
                System.out.println("Item not found!");
        }

        boolean contains(T item) {
            return items.contains(item);
        }

        void display() {
            System.out.println("Inventory: " + items);
        }
    }

    public static void main(String[] args) {
        System.out.println("=== Test (a): checkIdentical ===");
        Integer[] arr1 = {10, 20, 30};
        Integer[] arr2 = {10, 20, 30};
        Integer[] arr3 = {10, 25, 30};
        System.out.println("arr1=[10,20,30], arr2=[10,20,30] → " + (checkIdentical(arr1, arr2) ? "Identical" : "Not identical"));
        System.out.println("arr1=[10,20,30], arr3=[10,25,30] → " + (checkIdentical(arr1, arr3) ? "Identical" : "Not identical"));

        String[] str1 = {"A", "B", "C"};
        String[] str2 = {"A", "B", "C"};
        System.out.println("\\nString arrays [A,B,C] vs [A,B,C] → " + (checkIdentical(str1, str2) ? "Identical" : "Not identical"));

        Double[] dbl1 = {1.5, 2.5, 3.5};
        Double[] dbl2 = {1.5, 2.5, 3.5};
        System.out.println("Double arrays [1.5,2.5,3.5] vs [1.5,2.5,3.5] → " + (checkIdentical(dbl1, dbl2) ? "Identical" : "Not identical"));

        System.out.println("\\n=== Test (b): sumByParity ===");
        List<Number> numbers = Arrays.asList(1, 2, 3, 4, 5, 6);
        System.out.println("Numbers: [1,2,3,4,5,6] → " + sumByParity(numbers));

        System.out.println("\\n=== Test (c): Inventory<T> - Type Safety ===");
        // (d) Instantiate Inventory<String>
        Inventory<String> productNames = new Inventory<>();
        productNames.add("Laptop");
        productNames.add("Mouse");
        productNames.add("Keyboard");
        productNames.display();

        // (d) Instantiate Inventory<Integer>
        Inventory<Integer> productCodes = new Inventory<>();
        productCodes.add(1001);
        productCodes.add(1002);
        productCodes.add(1003);
        productCodes.display();

        // (d) Instantiate Inventory<Double>
        Inventory<Double> prices = new Inventory<>();
        prices.add(45000.0);
        prices.add(500.0);
        prices.add(3500.0);
        prices.display();

        // (e) Demonstrate type safety

import java.util.*;

public class GradeAnalysis {
    // (a) Generic method compareRecords
    static <T> boolean compareRecords(T[] batch1, T[] batch2) {
        if (batch1.length != batch2.length) return false;
        for (int i = 0; i < batch1.length; i++) {
            if (!batch1[i].equals(batch2[i])) return false;
        }
        return true;
    }

    // (b) Generic method analyseNumbers
    static String analyseNumbers(List<? extends Number> marks) {
        long evenSum = 0, oddSum = 0;
        for (Number n : marks) {
            int val = n.intValue();
            if (val % 2 == 0) evenSum += val;
            else oddSum += val;
        }
        return "Even-valued marks sum: " + evenSum + ", Odd-valued marks sum: " + oddSum;
    }

    // (c) Generic class with bounded type parameter
    static class GradeBook<T extends Comparable<T>> {
        private List<T> grades = new ArrayList<>();

        void add(T grade) {
            grades.add(grade);
        }

        T getMax() {
            if (grades.isEmpty()) return null;
            T max = grades.get(0);
            for (T g : grades) {
                if (g.compareTo(max) > 0) max = g;
            }
            return max;
        }

        T getMin() {
            if (grades.isEmpty()) return null;
            T min = grades.get(0);
            for (T g : grades) {
                if (g.compareTo(min) < 0) min = g;
            }
            return min;
        }

        void displayAll() {
            System.out.println("Grades: " + grades);
        }
    }

    // (e) Generic method swap
    static <T> void swap(T[] arr, int i, int j) {
        if (i >= 0 && i < arr.length && j >= 0 && j < arr.length) {
            T temp = arr[i];
            arr[i] = arr[j];
            arr[j] = temp;
        }
    }

function renderPrograms(list) {
  const grid = document.getElementById('programGrid');
  const noResults = document.getElementById('noResults');
  const counter = document.getElementById('result-count');
  grid.innerHTML = '';

  if (list.length === 0) {
    noResults.style.display = 'block';
    counter.textContent = 'Showing 0 of ' + programs.length;
    return;
  }
  noResults.style.display = 'none';
  counter.textContent = 'Showing ' + list.length + ' of ' + programs.length;

  let lastSection = '';
  list.forEach(prog => {
    const secLabel = sections[prog.id];
    if (secLabel && secLabel !== lastSection) {
      lastSection = secLabel;
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = secLabel;
      grid.appendChild(lbl);
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-num">${String(prog.id).padStart(2,'0')}</div>
      <div class="card-info">
        <div class="card-title">${prog.title}</div>
        <span class="card-tag">${prog.tag}</span>
      </div>
      <button class="copy-btn" onclick="copyCode(${prog.id}, this)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        Copy Code
      </button>
    `;
    grid.appendChild(card);
  });
}

function copyCode(id, btn) {
  const prog = programs.find(p => p.id === id);
  if (!prog) return;
  navigator.clipboard.writeText(prog.code).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Code Copied!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Code`;
    }, 2000);
  });
}

function filterPrograms() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const filtered = q
    ? programs.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.tag.toLowerCase().includes(q) ||
        p.practical.toLowerCase().includes(q))
    : programs;
  renderPrograms(filtered);
}

// Initial render
renderPrograms(programs);
