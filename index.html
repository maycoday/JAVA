<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBMS Practicals – Solution Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --border: #e2e0d8;
    --text: #1a1917;
    --muted: #7a7870;
    --sql-accent: #2563eb;
    --sql-light: #eff6ff;
    --sql-border: #bfdbfe;
    --mongo-accent: #16a34a;
    --mongo-light: #f0fdf4;
    --mongo-border: #bbf7d0;
    --plsql-accent: #9333ea;
    --plsql-light: #faf5ff;
    --plsql-border: #e9d5ff;
    --jdbc-accent: #ea580c;
    --jdbc-light: #fff7ed;
    --jdbc-border: #fed7aa;
    --copied: #16a34a;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 2px 8px rgba(0,0,0,0.05);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px 0;
  }

  /* ── HEADER ── */
  header {
    background: var(--text);
    color: #fff;
    padding: 28px 24px 22px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .header-inner {
    max-width: 860px;
    margin: 0 auto;
  }
  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.1rem, 3vw, 1.45rem);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  header p {
    font-size: 0.8rem;
    color: #a0a0a0;
    font-weight: 300;
    margin-bottom: 14px;
  }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative;
    max-width: 420px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #888;
    pointer-events: none;
    width: 16px; height: 16px;
  }
  #searchInput {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border-radius: 8px;
    border: 1.5px solid #3a3a3a;
    background: #2a2a2a;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput::placeholder { color: #777; }
  #searchInput:focus { border-color: #666; }

  /* ── MAIN ── */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 16px 0;
  }

  /* ── SECTION ── */
  .section { margin-bottom: 40px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }
  .section-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .section-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
  }
  .section-count {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  /* Section colour variants */
  .sql-section .section-header { border-color: var(--sql-border); }
  .sql-section .section-badge { background: var(--sql-light); color: var(--sql-accent); }
  .mongo-section .section-header { border-color: var(--mongo-border); }
  .mongo-section .section-badge { background: var(--mongo-light); color: var(--mongo-accent); }
  .plsql-section .section-header { border-color: var(--plsql-border); }
  .plsql-section .section-badge { background: var(--plsql-light); color: var(--plsql-accent); }
  .jdbc-section .section-header { border-color: var(--jdbc-border); }
  .jdbc-section .section-badge { background: var(--jdbc-light); color: var(--jdbc-accent); }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    margin-bottom: 8px;
    transition: box-shadow 0.18s, border-color 0.18s, transform 0.15s;
    box-shadow: var(--shadow);
  }
  .card:hover { box-shadow: 0 3px 16px rgba(0,0,0,0.09); transform: translateY(-1px); }
  .card-left { display: flex; align-items: center; gap: 12px; }
  .card-num {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    min-width: 26px;
  }
  .card-title { font-size: 0.9rem; font-weight: 500; }

  /* ── COPY BUTTON ── */
  .copy-btn {
    background: none;
    border: 1.5px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.18s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .copy-btn:hover {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .copy-btn.copied {
    background: var(--copied);
    color: #fff;
    border-color: var(--copied);
  }

  /* Section-specific btn hover */
  .sql-section .copy-btn:hover { background: var(--sql-accent); border-color: var(--sql-accent); }
  .mongo-section .copy-btn:hover { background: var(--mongo-accent); border-color: var(--mongo-accent); }
  .plsql-section .copy-btn:hover { background: var(--plsql-accent); border-color: var(--plsql-accent); }
  .jdbc-section .copy-btn:hover { background: var(--jdbc-accent); border-color: var(--jdbc-accent); }

  /* ── NO RESULTS ── */
  #noResults {
    text-align: center;
    padding: 48px 0;
    color: var(--muted);
    display: none;
  }
  #noResults svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.4; }
  #noResults p { font-size: 0.9rem; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1917;
    color: #fff;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-family: 'Space Mono', monospace;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
    opacity: 0;
    z-index: 9999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── EMPTY SECTION ── */
  .section.hidden { display: none; }

  @media (max-width: 480px) {
    .card { flex-wrap: wrap; gap: 10px; }
    .copy-btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>📚 DBMS Practicals – Solution Hub</h1>
    <p>Click "Copy Code" on any program to instantly copy the solution to clipboard</p>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search programs..." autocomplete="off">
    </div>
  </div>
</header>

<main>

<!-- ══════════════════════════════════
     SQL SECTION
══════════════════════════════════ -->
<div class="section sql-section" id="section-sql">
  <div class="section-header">
    <span class="section-badge">SQL</span>
    <span class="section-title">SQL Select Queries</span>
    <span class="section-count" id="count-sql"></span>
  </div>
  <div class="cards" id="cards-sql"></div>
</div>

<!-- ══════════════════════════════════
     MONGODB SECTION
══════════════════════════════════ -->
<div class="section mongo-section" id="section-mongo">
  <div class="section-header">
    <span class="section-badge">MongoDB</span>
    <span class="section-title">MongoDB Queries</span>
    <span class="section-count" id="count-mongo"></span>
  </div>
  <div class="cards" id="cards-mongo"></div>
</div>

<!-- ══════════════════════════════════
     PL/SQL SECTION
══════════════════════════════════ -->
<div class="section plsql-section" id="section-plsql">
  <div class="section-header">
    <span class="section-badge">PL/SQL</span>
    <span class="section-title">PL/SQL Procedures, Functions & Triggers</span>
    <span class="section-count" id="count-plsql"></span>
  </div>
  <div class="cards" id="cards-plsql"></div>
</div>

<!-- ══════════════════════════════════
     JDBC SECTION
══════════════════════════════════ -->
<div class="section jdbc-section" id="section-jdbc">
  <div class="section-header">
    <span class="section-badge">JDBC</span>
    <span class="section-title">JDBC – Java + Database</span>
    <span class="section-count" id="count-jdbc"></span>
  </div>
  <div class="cards" id="cards-jdbc"></div>
</div>

<div id="noResults">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    <path d="M8 11h6M11 8v6" stroke-dasharray="2 2"/>
  </svg>
  <p>No programs found matching your search.</p>
</div>

</main>
<div id="toast">✓ Code Copied!</div>

<script>
// ═══════════════════════════════════════════════════
//  DATA

const sqlData = [
  {
    name: "Library Management System",
    code: `-- Schema: BOOK(Book_ID, Title, Author, Category, Price), MEMBER(Member_ID, Member_Name, City), ISSUE(Issue_ID, Book_ID, Member_ID, Issue_Date, Return_Date)

-- 1. Display all books with price greater than 500
SELECT * FROM BOOK WHERE Price > 500;

-- 2. Display member details from Pune city
SELECT * FROM MEMBER WHERE City='Pune';

-- 3. Show book title and member name for issued books
SELECT B.Title, M.Member_Name
FROM BOOK B
JOIN ISSUE I ON B.Book_ID=I.Book_ID
JOIN MEMBER M ON M.Member_ID=I.Member_ID;

-- 4. Count total books in each category
SELECT Category, COUNT(*)
FROM BOOK
GROUP BY Category;

-- 5. Display members who issued books after '2026-01-01'
SELECT DISTINCT M.Member_Name
FROM MEMBER M
JOIN ISSUE I ON M.Member_ID=I.Member_ID
WHERE Issue_Date > '2026-01-01';

-- 6. Display the member who issued maximum books
SELECT M.Member_Name, COUNT(*) AS Total_Books
FROM MEMBER M
JOIN ISSUE I ON M.Member_ID=I.Member_ID
GROUP BY M.Member_Name
ORDER BY Total_Books DESC
LIMIT 1;

-- 7. Display category-wise average price of books having average price greater than 400
SELECT Category, AVG(Price)
FROM BOOK
GROUP BY Category
HAVING AVG(Price) > 400;`
  },
  {
    name: "Hospital Management System",
    code: `-- Schema: DOCTOR(Doctor_ID, Doctor_Name, Specialization, Salary), PATIENT(Patient_ID, Patient_Name, Age, City), APPOINTMENT(Appointment_ID, Doctor_ID, Patient_ID, Appointment_Date)

-- 1. Display all doctors with salary greater than 80000
SELECT * FROM DOCTOR WHERE Salary > 80000;

-- 2. Display patient details whose age is above 50
SELECT * FROM PATIENT WHERE Age > 50;

-- 3. Show doctor name and patient name for appointments
SELECT D.Doctor_Name, P.Patient_Name
FROM DOCTOR D
JOIN APPOINTMENT A ON D.Doctor_ID=A.Doctor_ID
JOIN PATIENT P ON P.Patient_ID=A.Patient_ID;

-- 4. Count total doctors specialization-wise
SELECT Specialization, COUNT(*)
FROM DOCTOR
GROUP BY Specialization;

-- 5. Display appointments after '2026-03-01'
SELECT * FROM APPOINTMENT
WHERE Appointment_Date > '2026-03-01';

-- 6. Find the doctor handling maximum appointments
SELECT D.Doctor_Name, COUNT(*) AS Total_Appointments
FROM DOCTOR D
JOIN APPOINTMENT A ON D.Doctor_ID=A.Doctor_ID
GROUP BY D.Doctor_Name
ORDER BY Total_Appointments DESC
LIMIT 1;

-- 7. Display specialization-wise average salary greater than 70000
SELECT Specialization, AVG(Salary)
FROM DOCTOR
GROUP BY Specialization
HAVING AVG(Salary) > 70000;`
  },
  {
    name: "Online Shopping System",
    code: `-- Schema: CUSTOMER(Customer_ID, Customer_Name, City), PRODUCT(Product_ID, Product_Name, Category, Price), ORDERS(Order_ID, Customer_ID, Product_ID, Quantity, Order_Date)

-- 1. Display products with price less than 1000
SELECT * FROM PRODUCT WHERE Price < 1000;

-- 2. Display customers from Mumbai
SELECT * FROM CUSTOMER WHERE City='Mumbai';

-- 3. Show customer name and product name for all orders
SELECT C.Customer_Name, P.Product_Name
FROM CUSTOMER C
JOIN ORDERS O ON C.Customer_ID=O.Customer_ID
JOIN PRODUCT P ON P.Product_ID=O.Product_ID;

-- 4. Count products category-wise
SELECT Category, COUNT(*)
FROM PRODUCT
GROUP BY Category;

-- 5. Display orders placed in April 2026
SELECT * FROM ORDERS
WHERE MONTH(Order_Date)=4 AND YEAR(Order_Date)=2026;

-- 6. Find the customer who placed maximum orders
SELECT C.Customer_Name, COUNT(*) AS Total_Orders
FROM CUSTOMER C
JOIN ORDERS O ON C.Customer_ID=O.Customer_ID
GROUP BY C.Customer_Name
ORDER BY Total_Orders DESC
LIMIT 1;

-- 7. Display category-wise maximum product price
SELECT Category, MAX(Price)
FROM PRODUCT
GROUP BY Category;`
  },
  {
    name: "College Management System",
    code: `-- Schema: STUDENT(Student_ID, Student_Name, Branch, CGPA), FACULTY(Faculty_ID, Faculty_Name, Department), COURSE(Course_ID, Course_Name, Faculty_ID)

-- 1. Display students with CGPA greater than 8
SELECT * FROM STUDENT WHERE CGPA > 8;

-- 2. Display faculty from IT department
SELECT * FROM FACULTY WHERE Department='IT';

-- 3. Show course name with faculty name
SELECT C.Course_Name, F.Faculty_Name
FROM COURSE C
JOIN FACULTY F ON C.Faculty_ID=F.Faculty_ID;

-- 4. Count students branch-wise
SELECT Branch, COUNT(*)
FROM STUDENT
GROUP BY Branch;

-- 5. Display students sorted by CGPA descending
SELECT * FROM STUDENT
ORDER BY CGPA DESC;

-- 6. Find the branch having maximum students
SELECT Branch, COUNT(*) AS Total_Students
FROM STUDENT
GROUP BY Branch
ORDER BY Total_Students DESC
LIMIT 1;

-- 7. Display average CGPA branch-wise having average CGPA above 7
SELECT Branch, AVG(CGPA)
FROM STUDENT
GROUP BY Branch
HAVING AVG(CGPA) > 7;`
  },
  {
    name: "Banking System",
    code: `-- Schema: CUSTOMER(Customer_ID, Customer_Name, City), ACCOUNT(Account_No, Customer_ID, Account_Type, Balance), TRANSACTION(Transaction_ID, Account_No, Amount, Transaction_Type)

-- 1. Display accounts with balance greater than 50000
SELECT * FROM ACCOUNT WHERE Balance > 50000;

-- 2. Display customers from Nashik
SELECT * FROM CUSTOMER WHERE City='Nashik';

-- 3. Show customer name with account type
SELECT C.Customer_Name, A.Account_Type
FROM CUSTOMER C
JOIN ACCOUNT A ON C.Customer_ID=A.Customer_ID;

-- 4. Count accounts type-wise
SELECT Account_Type, COUNT(*)
FROM ACCOUNT
GROUP BY Account_Type;

-- 5. Display debit transactions only
SELECT * FROM TRANSACTION
WHERE Transaction_Type='Debit';

-- 6. Find the customer having highest balance
SELECT C.Customer_Name, MAX(A.Balance)
FROM CUSTOMER C
JOIN ACCOUNT A ON C.Customer_ID=A.Customer_ID;

-- 7. Display account type-wise average balance greater than 30000
SELECT Account_Type, AVG(Balance)
FROM ACCOUNT
GROUP BY Account_Type
HAVING AVG(Balance) > 30000;`
  },
  {
    name: "Employee Payroll System",
    code: `-- Schema: EMPLOYEE(Emp_ID, Emp_Name, Department, Salary), PROJECT(Project_ID, Project_Name, Budget), WORKS_ON(Emp_ID, Project_ID, Hours)

-- 1. Display employees with salary above 60000
SELECT * FROM EMPLOYEE WHERE Salary > 60000;

-- 2. Display projects with budget greater than 100000
SELECT * FROM PROJECT WHERE Budget > 100000;

-- 3. Show employee name with project name
SELECT E.Emp_Name, P.Project_Name
FROM EMPLOYEE E
JOIN WORKS_ON W ON E.Emp_ID=W.Emp_ID
JOIN PROJECT P ON P.Project_ID=W.Project_ID;

-- 4. Count employees department-wise
SELECT Department, COUNT(*)
FROM EMPLOYEE
GROUP BY Department;

-- 5. Display employees sorted by salary descending
SELECT * FROM EMPLOYEE
ORDER BY Salary DESC;

-- 6. Find the department with highest average salary
SELECT Department, AVG(Salary) AS Avg_Salary
FROM EMPLOYEE
GROUP BY Department
ORDER BY Avg_Salary DESC
LIMIT 1;

-- 7. Display employees working on more than one project
SELECT Emp_ID, COUNT(Project_ID)
FROM WORKS_ON
GROUP BY Emp_ID
HAVING COUNT(Project_ID) > 1;`
  },
  {
    name: "Railway Reservation System",
    code: `-- Schema: TRAIN(Train_ID, Train_Name, Source, Destination), PASSENGER(Passenger_ID, Passenger_Name, Age), RESERVATION(Reservation_ID, Train_ID, Passenger_ID, Journey_Date)

-- 1. Display trains starting from Pune
SELECT * FROM TRAIN WHERE Source='Pune';

-- 2. Display passengers whose age is greater than 60
SELECT * FROM PASSENGER WHERE Age > 60;

-- 3. Show passenger name with train name
SELECT P.Passenger_Name, T.Train_Name
FROM PASSENGER P
JOIN RESERVATION R ON P.Passenger_ID=R.Passenger_ID
JOIN TRAIN T ON T.Train_ID=R.Train_ID;

-- 4. Count reservations train-wise
SELECT Train_ID, COUNT(*)
FROM RESERVATION
GROUP BY Train_ID;

-- 5. Display reservations after '2026-02-01'
SELECT * FROM RESERVATION
WHERE Journey_Date > '2026-02-01';

-- 6. Find the train with maximum reservations
SELECT Train_ID, COUNT(*) AS Total_Reservations
FROM RESERVATION
GROUP BY Train_ID
ORDER BY Total_Reservations DESC
LIMIT 1;

-- 7. Display source-wise total trains
SELECT Source, COUNT(*)
FROM TRAIN
GROUP BY Source;`
  },
  {
    name: "Hotel Management System",
    code: `-- Schema: ROOM(Room_No, Room_Type, Charges), CUSTOMER(Customer_ID, Customer_Name, City), BOOKING(Booking_ID, Room_No, Customer_ID, CheckIn_Date)

-- 1. Display rooms with charges greater than 3000
SELECT * FROM ROOM WHERE Charges > 3000;

-- 2. Display customers from Delhi
SELECT * FROM CUSTOMER WHERE City='Delhi';

-- 3. Show customer name with room type
SELECT C.Customer_Name, R.Room_Type
FROM CUSTOMER C
JOIN BOOKING B ON C.Customer_ID=B.Customer_ID
JOIN ROOM R ON R.Room_No=B.Room_No;

-- 4. Count rooms type-wise
SELECT Room_Type, COUNT(*)
FROM ROOM
GROUP BY Room_Type;

-- 5. Display bookings in May 2026
SELECT * FROM BOOKING
WHERE MONTH(CheckIn_Date)=5;

-- 6. Find the most booked room type
SELECT R.Room_Type, COUNT(*) AS Total_Bookings
FROM ROOM R
JOIN BOOKING B ON R.Room_No=B.Room_No
GROUP BY R.Room_Type
ORDER BY Total_Bookings DESC
LIMIT 1;

-- 7. Display average room charges type-wise
SELECT Room_Type, AVG(Charges)
FROM ROOM
GROUP BY Room_Type;`
  },
  {
    name: "University Examination System",
    code: `-- Schema: STUDENT(Student_ID, Student_Name, Branch), SUBJECT(Subject_ID, Subject_Name, Credits), RESULT(Student_ID, Subject_ID, Marks)

-- 1. Display students from Computer branch
SELECT * FROM STUDENT WHERE Branch='Computer';

-- 2. Display subjects with credits greater than 3
SELECT * FROM SUBJECT WHERE Credits > 3;

-- 3. Show student name with subject name
SELECT S.Student_Name, SU.Subject_Name
FROM STUDENT S
JOIN RESULT R ON S.Student_ID=R.Student_ID
JOIN SUBJECT SU ON SU.Subject_ID=R.Subject_ID;

-- 4. Count students branch-wise
SELECT Branch, COUNT(*)
FROM STUDENT
GROUP BY Branch;

-- 5. Display students scoring above 75 marks
SELECT * FROM RESULT WHERE Marks > 75;

-- 6. Find the topper student
SELECT Student_ID, SUM(Marks) AS Total
FROM RESULT
GROUP BY Student_ID
ORDER BY Total DESC
LIMIT 1;

-- 7. Display average marks subject-wise greater than 70
SELECT Subject_ID, AVG(Marks)
FROM RESULT
GROUP BY Subject_ID
HAVING AVG(Marks) > 70;`
  },
  {
    name: "Inventory Management System",
    code: `-- Schema: PRODUCT(Product_ID, Product_Name, Stock, Price), SUPPLIER(Supplier_ID, Supplier_Name, City), SUPPLY(Product_ID, Supplier_ID, Quantity)

-- 1. Display products with stock less than 20
SELECT * FROM PRODUCT WHERE Stock < 20;

-- 2. Display suppliers from Chennai
SELECT * FROM SUPPLIER WHERE City='Chennai';

-- 3. Show product name with supplier name
SELECT P.Product_Name, S.Supplier_Name
FROM PRODUCT P
JOIN SUPPLY SU ON P.Product_ID=SU.Product_ID
JOIN SUPPLIER S ON S.Supplier_ID=SU.Supplier_ID;

-- 4. Count products supplier-wise
SELECT Supplier_ID, COUNT(*)
FROM SUPPLY
GROUP BY Supplier_ID;

-- 5. Display products with price between 500 and 2000
SELECT * FROM PRODUCT
WHERE Price BETWEEN 500 AND 2000;

-- 6. Find supplier supplying maximum quantity
SELECT Supplier_ID, SUM(Quantity) AS Total_Qty
FROM SUPPLY
GROUP BY Supplier_ID
ORDER BY Total_Qty DESC
LIMIT 1;

-- 7. Display average product price greater than 1000
SELECT AVG(Price)
FROM PRODUCT
HAVING AVG(Price) > 1000;`
  },
  {
    name: "Movie Ticket Booking System",
    code: `-- Schema: MOVIE(Movie_ID, Movie_Name, Genre, Rating), CUSTOMER(Customer_ID, Customer_Name, City), BOOKING(Booking_ID, Movie_ID, Customer_ID, Seats)

-- 1. Display movies with rating above 8
SELECT * FROM MOVIE WHERE Rating > 8;

-- 2. Display customers from Hyderabad
SELECT * FROM CUSTOMER WHERE City='Hyderabad';

-- 3. Show movie name with customer name
SELECT M.Movie_Name, C.Customer_Name
FROM MOVIE M
JOIN BOOKING B ON M.Movie_ID=B.Movie_ID
JOIN CUSTOMER C ON C.Customer_ID=B.Customer_ID;

-- 4. Count movies genre-wise
SELECT Genre, COUNT(*)
FROM MOVIE
GROUP BY Genre;

-- 5. Display bookings with seats greater than 4
SELECT * FROM BOOKING WHERE Seats > 4;

-- 6. Find movie with maximum bookings
SELECT Movie_ID, COUNT(*) AS Total_Bookings
FROM BOOKING
GROUP BY Movie_ID
ORDER BY Total_Bookings DESC
LIMIT 1;

-- 7. Display average rating genre-wise
SELECT Genre, AVG(Rating)
FROM MOVIE
GROUP BY Genre;`
  },
  {
    name: "Sports Club Management System",
    code: `-- Schema: PLAYER(Player_ID, Player_Name, Sport, Age), COACH(Coach_ID, Coach_Name, Experience), TRAINING(Player_ID, Coach_ID, Hours)

-- 1. Display players older than 25
SELECT * FROM PLAYER WHERE Age > 25;

-- 2. Display coaches with experience greater than 10 years
SELECT * FROM COACH WHERE Experience > 10;

-- 3. Show player name with coach name
SELECT P.Player_Name, C.Coach_Name
FROM PLAYER P

JOIN COACH C ON C.Coach_ID=T.Coach_ID;

-- 4. Count players sport-wise

GROUP BY Sport;

SELECT * FROM PLAYER ORDER BY Age DESC;

-- 1. Create empp table and insert records
CREATE TABLE empp (
  eid INT PRIMARY KEY,
  ename VARCHAR(50),
  salary DECIMAL(10,2),
  dept VARCHAR(30)
);

INSERT INTO empp VALUES (1, 'Alice', 50000, 'IT');
INSERT INTO empp VALUES (2, 'Bob', 60000, 'HR');
INSERT INTO empp VALUES (3, 'Charlie', 45000, 'Finance');

-- 2. Create procedure add_employee() to insert employee details
DELIMITER //
CREATE PROCEDURE add_employee(IN p_eid INT, IN p_ename VARCHAR(50), IN p_salary DECIMAL(10,2), IN p_dept VARCHAR(30))
BEGIN
  INSERT INTO empp(eid, ename, salary, dept) VALUES (p_eid, p_ename, p_salary, p_dept);
END //
DELIMITER ;

-- 3. Create trigger to convert employee name into uppercase before insert
DELIMITER //
CREATE TRIGGER before_emp_insert
BEFORE INSERT ON empp
FOR EACH ROW
BEGIN
  SET NEW.ename = UPPER(NEW.ename);
END //
DELIMITER ;

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════

function renderSection(data, containerId, countId, prefix) {
  const container = document.getElementById(containerId);
  const countEl = document.getElementById(countId);
  container.innerHTML = '';
  countEl.textContent = data.length + ' programs';

  data.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = item.name.toLowerCase();

    const left = document.createElement('div');
    left.className = 'card-left';
    left.innerHTML = `<span class="card-num">${prefix}${String(i+1).padStart(2,'0')}</span><span class="card-title">${item.name}</span>`;

    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy Code';
    btn.onclick = () => copyCode(item.code, btn);

    card.appendChild(left);
    card.appendChild(btn);
    container.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════
//  COPY
// ═══════════════════════════════════════════════════

let toastTimer;
function copyCode(code, btn) {
  navigator.clipboard.writeText(code).then(() => {
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy Code';
      btn.classList.remove('copied');
    }, 2000);
    showToast();
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Code'; btn.classList.remove('copied'); }, 2000);
    showToast();
  });
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  let totalVisible = 0;

  ['sql', 'mongo', 'plsql', 'jdbc'].forEach(sec => {
    const cards = document.querySelectorAll(`#cards-${sec} .card`);
    let visible = 0;
    cards.forEach(card => {
      const match = !q || card.dataset.name.includes(q);
      card.style.display = match ? '' : 'none';
      if (match) visible++;
    });
    totalVisible += visible;
    document.getElementById(`section-${sec}`).classList.toggle('hidden', visible === 0);
    document.getElementById(`count-${sec}`).textContent = visible + ' programs';
  });

  document.getElementById('noResults').style.display = totalVisible === 0 ? 'block' : 'none';
});
