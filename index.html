class BST {
    Node* root;
public:
    BST() : root(nullptr) {}

    Node* insert(Node* node, int val) {
        if (!node) return new Node(val);
        if (val < node->isbn) node->left = insert(node->left, val);
        else if (val > node->isbn) node->right = insert(node->right, val);
        return node;
    }
    void insert(int val) { root = insert(root, val); }

    // Recursive Traversals
    void inorder(Node* n) {
        if (!n) return;
        inorder(n->left); cout << n->isbn << " "; inorder(n->right);
    }
    void preorder(Node* n) {
        if (!n) return;
        cout << n->isbn << " "; preorder(n->left); preorder(n->right);
    }
    void postorder(Node* n) {
        if (!n) return;
        postorder(n->left); postorder(n->right); cout << n->isbn << " ";
    }

    // Non-Recursive Inorder
    void inorderNR() {
        stack<Node*> s; Node* curr = root;
        while (curr || !s.empty()) {
            while (curr) { s.push(curr); curr = curr->left; }
            curr = s.top(); s.pop();
            cout << curr->isbn << " ";
            curr = curr->right;
        }
    }

    // Non-Recursive Preorder
    void preorderNR() {
        if (!root) return;
        stack<Node*> s; s.push(root);
        while (!s.empty()) {
            Node* n = s.top(); s.pop();
            cout << n->isbn << " ";
            if (n->right) s.push(n->right);
            if (n->left) s.push(n->left);
        }
    }

    // Non-Recursive Postorder
    void postorderNR() {
        if (!root) return;
        stack<Node*> s1, s2; s1.push(root);
        while (!s1.empty()) {
            Node* n = s1.top(); s1.pop(); s2.push(n);
            if (n->left) s1.push(n->left);
            if (n->right) s1.push(n->right);
        }
        while (!s2.empty()) { cout << s2.top()->isbn << " "; s2.pop(); }
    }

    // Level Order

        if (!root) return;
        queue<Node*> q; q.push(root);
        while (!q.empty()) {
            int sz = q.size();
            while (sz--) {
                Node* n = q.front(); q.pop();

            curr = (val < curr->isbn) ? curr->left : curr->right;
        }
        return false;
    }

    Node* findMin(Node* n) {
        while (n->left) n = n->left;
        return n;
    }

        if (val < n->isbn) n->left = deleteNode(n->left, val);
        else if (val > n->isbn) n->right = deleteNode(n->right, val);
        else {
            if (!n->left) { Node* t = n->right; delete n; return t; }
            if (!n->right) { Node* t = n->left; delete n; return t; }
            Node* min = findMin(n->right);
            n->isbn = min->isbn;
            n->right = deleteNode(n->right, min->isbn);
        }
        return n;

};

using namespace std;

struct TBTNode {
    int flight;
    TBTNode *left, *right;
    bool lThread, rThread;
    TBTNode(int v) : flight(v), left(nullptr), right(nullptr), lThread(false), rThread(false) {}
};

class TBT {
    TBTNode* root;
public:
    TBT() : root(nullptr) {}

    TBTNode* inorderSuccessor(TBTNode* n) {
        if (n->rThread) return n->right;
        n = n->right;
        while (!n->lThread) n = n->left;
        return n;
    }

    void insert(int val) {
        TBTNode* nn = new TBTNode(val);
        if (!root) { root = nn; nn->lThread = nn->rThread = true; return; }
        TBTNode* curr = root, *par = nullptr;
        bool goLeft = false;
        while (true) {
            par = curr;
            if (val < curr->flight) {
                if (curr->lThread) { goLeft = true; break; }
                curr = curr->left;
            } else {
                if (curr->rThread) { goLeft = false; break; }
                curr = curr->right;
            }
        }
        if (goLeft) {
            nn->left = par->left; nn->lThread = true;
            nn->right = par; nn->rThread = true;
            par->left = nn; par->lThread = false;
        } else {
            nn->right = par->right; nn->rThread = true;
            nn->left = par; nn->lThread = true;
            par->right = nn; par->rThread = false;
        }
    }

    void inorderNR() {
        TBTNode* curr = root;
        while (!curr->lThread) curr = curr->left;
        while (curr) {

void updH(Node* n) { if (n) n->height = 1 + max(height(n->left), height(n->right)); }

Node* rotR(Node* y) {
    Node* x = y->left, *T = x->right;

    updH(y); updH(x);
    cout << "LL Rotation at " << y->id << endl;
    return x;
}
Node* rotL(Node* x) {
    Node* y = x->right, *T = y->left;
    y->left = x; x->right = T;
    updH(x); updH(y);
    cout << "RR Rotation at " << x->id << endl;
    return y;
}

    else return n;

    int parent[V], key[V]; bool inMST[V];
    for (int i=0;i<V;i++){key[i]=INT_MAX;inMST[i]=false;}
    key[0]=0; parent[0]=-1;
    for (int cnt=0;cnt<V-1;cnt++) {
        int u=-1;
        for (int v=0;v<V;v++) if(!inMST[v]&&(u==-1||key[v]<key[u])) u=v;
        inMST[u]=true;
        for (int v=0;v<V;v++)
            if (graph[u][v]&&!inMST[v]&&graph[u][v]<key[v]) { parent[v]=u; key[v]=graph[u][v]; }
    }
    int total=0;
    cout<<"Prim's MST:" << endl;
    for (int i=1;i<V;i++) { cout<<names[parent[i]]<<" - "<<names[i]<<" : "<<graph[i][parent[i]]<<endl; total+=graph[i][parent[i]]; }

int parent[V], rankArr[V];
int find(int x){return parent[x]==x?x:parent[x]=find(parent[x]);}
